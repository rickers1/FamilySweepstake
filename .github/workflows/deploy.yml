name: Deploy Blazor WASM to GitHub Pages
on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # ---------------------------------------------------------
  # 1. BUILD JOB
  # ---------------------------------------------------------
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Cache .NET packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.nuget/packages
            ~/.dotnet/tools
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install WebAssembly Tools
        run: dotnet workload install wasm-tools

      # 🏷️ Version stamping
      - name: Generate version stamp
        run: |
          echo "window.appVersion = {" > wwwroot/version.js
          echo "  build: \"$(date -u '+%Y-%m-%d %H:%M:%S')\"," >> wwwroot/version.js
          echo "  commit: \"${GITHUB_SHA}\"" >> wwwroot/version.js
          echo "};" >> wwwroot/version.js


      # 📦 Publish standard Blazor WASM
      - name: Publish Blazor
        run: dotnet publish FamilySweepstake.csproj -c Release -o publish

      # 🔧 Explicitly fix Base Href, .nojekyll, and SPA routing for GitHub Pages
      - name: Fix GitHub Pages Routing and Base Path
        run: |
          touch publish/wwwroot/.nojekyll
          sed -i 's|<base href="/" />|<base href="/FamilySweepstake/" />|g' publish/wwwroot/index.html
          cp publish/wwwroot/index.html publish/wwwroot/404.html

      # ✅ Validate published output
      - name: Validate published output
        run: |
          if [ ! -f "publish/wwwroot/index.html" ]; then
            echo "❌ index.html missing"
            exit 1
          fi
          echo "✔ Static asset validation passed"

      # Upload Pages artifact
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@main
        with:
          path: publish/wwwroot

      # Upload build artifact for testing job
      - name: Upload build artifact for testing
        uses: actions/upload-artifact@v7
        with:
          name: wwwroot-artifact
          path: publish/wwwroot
          retention-days: 1

  # ---------------------------------------------------------
  # 2. TEST JOB
  # ---------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Run unit tests
        run: dotnet test --verbosity normal

  # ---------------------------------------------------------
  # 3. LIGHTHOUSE PERFORMANCE CHECK
  # ---------------------------------------------------------
  lighthouse:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v7
        with:
          name: wwwroot-artifact
          path: publish/wwwroot

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install Lighthouse
        run: npm install -g lighthouse

      - name: Serve published site
        run: |
          npm install -g http-server
          http-server publish/wwwroot -p 8080 &
          sleep 5

      - name: Run Lighthouse
        run: |
          lighthouse http://localhost:8080 \
            --quiet \
            --chrome-flags="--headless" \
            --preset=desktop \
            --output=json \
            --output-path=./lhreport.json
            
      - name: Check Lighthouse score
        run: |
          SCORE=$(jq '.categories.performance.score' lhreport.json)
          echo "Performance score: $SCORE"
          if (( $(echo "$SCORE < 0.35" | bc -l) )); then
            echo "⚠️ Lighthouse performance score is low ($SCORE), but continuing deployment."
          else
            echo "✔ Lighthouse performance OK"
          fi

  # ---------------------------------------------------------
  # 4. DEPLOY JOB
  # ---------------------------------------------------------
  deploy:
    needs: [test, lighthouse]
    environment:
      name: github-pages
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
